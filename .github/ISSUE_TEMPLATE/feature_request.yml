name: Feature request
description: Suggest a capability for certificate trust or host policy.
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Which trust model does this fit?
      options:
        - Per-host verification switch (current model)
        - Pin a specific certificate or CA instead of skipping verification
        - Both
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
