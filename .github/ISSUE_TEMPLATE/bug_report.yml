name: Bug report
description: The Certificate trust section or the TLS patch does not behave as expected.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove API keys, hostnames you consider private, and certificate contents before submitting.
  - type: input
    id: version
    attributes:
      label: dsh-tls-trust-anchor version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.2.2-rc.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Node version
      placeholder: macOS 15 · Node 24.21
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Settings section does not render
        - Adding or removing a host
        - Trust switch has no effect
        - TLS error still reported
        - Installation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal, redacted example.
      placeholder: |
        1. Add host example.internal
        2. Select the provider using that host
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
      description: Redact credentials and certificate contents. Browser console errors from `slot entry crashed` are useful.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys and any certificate or private hostname I do not want public.
          required: true
